# CI Forgejo Actions — la FORGE de ProjectFlow est la maison du code.
# Conversion du .gitlab-ci.yml (conservé pour référence) :
#   verification — push sur main : install + pnpm check (typecheck + build + verify)
name: ci
on:
  push:
    branches: [main]

jobs:
  verification:
    runs-on: docker
    container:
      image: node:22.18.0-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Outillage pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
