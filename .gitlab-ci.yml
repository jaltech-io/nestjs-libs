# =============================================================================
# nestjs-libs — packages npm @profeskills/* (auth, admin-auth, cache)
# Repo standalone, ex platform-apps/libs/nestjs-*
#
# STAGES : lint | deploy
#
# lint:libs    — auto sur main/MR : typecheck + build + verify des 3 libs
# deploy:<lib> — publie sur npmjs.com quand le tag "<lib>@<version>" correspondant
#                est pousse (ex: nestjs-auth@0.3.0). Necessite la variable CI/CD
#                NPM_TOKEN (token npm "Automation", masque, scope aux tags proteges).
#
# Release d'une lib :
#   1. bump "version" dans libs/<lib>/package.json + CHANGELOG, merger sur main
#   2. git tag <lib>@<version> && git push origin <lib>@<version>
#   3. le job deploy:<lib> du pipeline du tag publie sur npm
# =============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never

stages:
  - lint
  - deploy

lint:libs:
  stage: lint
  image: node:22.18.0-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.12.1 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm check
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: manual
      allow_failure: true

.deploy_lib:
  stage: deploy
  image: node:22.18.0-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - npm install --global npm@11.18.0
    - corepack enable
    - corepack prepare pnpm@10.12.1 --activate
  script:
    - |
      set -eu

      PROJECT="$LIB_PROJECT"
      TAG="${CI_COMMIT_TAG:-}"
      VERSION="${TAG#*@}"

      if [ -z "$TAG" ]; then
        echo "❌ Ce job se declenche sur un tag $PROJECT@<version> — lancez-le uniquement depuis le pipeline de ce tag, pas manuellement sur $CI_COMMIT_REF_NAME."
        exit 1
      fi

      case "$TAG" in
        "$PROJECT@$VERSION") ;;
        *) echo "❌ Tag $TAG incoherent avec le job $CI_JOB_NAME (attendu: $PROJECT@<version>)"; exit 1 ;;
      esac

      PACKAGE_JSON="libs/$PROJECT/package.json"
      test -f "$PACKAGE_JSON" || { echo "❌ $PACKAGE_JSON introuvable"; exit 1; }

      EXPECTED_NAME="@profeskills/$PROJECT"
      PACKAGE_NAME=$(node -p "require('./$PACKAGE_JSON').name")
      PACKAGE_VERSION=$(node -p "require('./$PACKAGE_JSON').version")
      PACKAGE_LICENSE=$(node -p "require('./$PACKAGE_JSON').license")
      PACKAGE_PRIVATE=$(node -p "String(require('./$PACKAGE_JSON').private === true)")
      PACKAGE_ACCESS=$(node -p "require('./$PACKAGE_JSON').publishConfig?.access ?? ''")

      [ "$PACKAGE_NAME" = "$EXPECTED_NAME" ] || { echo "❌ Nom de package $PACKAGE_NAME != $EXPECTED_NAME"; exit 1; }
      [ "$PACKAGE_VERSION" = "$VERSION" ] || { echo "❌ Version du tag ($VERSION) != package.json ($PACKAGE_VERSION)"; exit 1; }
      [ "$PACKAGE_LICENSE" = "MIT" ] || { echo "❌ La license doit etre MIT"; exit 1; }
      [ "$PACKAGE_PRIVATE" = "false" ] || { echo "❌ Le package est marque private"; exit 1; }
      [ "$PACKAGE_ACCESS" = "public" ] || { echo "❌ publishConfig.access doit etre 'public'"; exit 1; }

      git fetch origin main --quiet
      git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main || { echo "❌ Le commit tagge doit appartenir a main"; exit 1; }

      pnpm install --frozen-lockfile
      pnpm check

      DIST_DIR="dist/libs/$PROJECT"
      test -d "$DIST_DIR" || { echo "❌ $DIST_DIR introuvable apres build"; exit 1; }

      BUILT_NAME=$(node -p "require('./$DIST_DIR/package.json').name")
      BUILT_VERSION=$(node -p "require('./$DIST_DIR/package.json').version")
      [ "$BUILT_NAME" = "$EXPECTED_NAME" ] || { echo "❌ Package construit: nom invalide"; exit 1; }
      [ "$BUILT_VERSION" = "$VERSION" ] || { echo "❌ Package construit: version invalide"; exit 1; }
      test -f "$DIST_DIR/$(node -p "require('./$DIST_DIR/package.json').main")" || { echo "❌ Entree 'main' manquante"; exit 1; }
      test -f "$DIST_DIR/$(node -p "require('./$DIST_DIR/package.json').types")" || { echo "❌ Entree 'types' manquante"; exit 1; }

      npm pack "$DIST_DIR" --dry-run

      case "$VERSION" in
        *-*) NPM_DIST_TAG="next" ;;
        *)   NPM_DIST_TAG="latest" ;;
      esac

      npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
      npm publish "$DIST_DIR" --access public --tag "$NPM_DIST_TAG"
      echo "✅ Publie $PACKAGE_NAME@$VERSION sur npm (dist-tag: $NPM_DIST_TAG)"

deploy:nestjs-auth:
  extends: .deploy_lib
  variables:
    LIB_PROJECT: nestjs-auth
  rules:
    - if: $CI_COMMIT_TAG =~ /^nestjs-auth@/
      when: on_success
    - when: manual
      allow_failure: true
  environment:
    name: npm-publish/nestjs-auth

deploy:nestjs-admin-auth:
  extends: .deploy_lib
  variables:
    LIB_PROJECT: nestjs-admin-auth
  rules:
    - if: $CI_COMMIT_TAG =~ /^nestjs-admin-auth@/
      when: on_success
    - when: manual
      allow_failure: true
  environment:
    name: npm-publish/nestjs-admin-auth

deploy:nestjs-cache:
  extends: .deploy_lib
  variables:
    LIB_PROJECT: nestjs-cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^nestjs-cache@/
      when: on_success
    - when: manual
      allow_failure: true
  environment:
    name: npm-publish/nestjs-cache
