# CI GitHub Actions — GitHub est desormais la maison du code des libs (bascule
# 26/09/2026, remplace .forgejo/workflows/ci.yml).
#   verification — push sur main : install + pnpm check (typecheck + build + verify)
name: ci
on:
  push:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Outillage pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
